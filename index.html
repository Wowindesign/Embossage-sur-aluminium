<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atelier – Embossage sur aluminium</title><style>*{box-sizing:border-box}body{margin:0;background:#07152b;color:#f7edd9;font-family:Arial,sans-serif;overflow:hidden}.slide{display:grid;grid-template-columns:42% 58%;height:100dvh}.words{background:#071a39;padding:clamp(24px,5vw,80px);display:flex;flex-direction:column;justify-content:center}.eyebrow{color:#a7c7e8;letter-spacing:.15em;font-size:clamp(13px,1.3vw,19px)}h1{font-size:clamp(28px,3.2vw,58px);line-height:1.13;margin:25px 0}p{font-size:clamp(17px,1.8vw,30px);line-height:1.55}.photo{background:#12345a;display:flex;align-items:center;justify-content:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:contain;animation:enter .7s ease}@keyframes enter{from{opacity:.2;transform:scale(1.03)}to{opacity:1;transform:scale(1)}}.controls{position:absolute;bottom:16px;left:22px;display:flex;gap:9px;align-items:center}button{background:#193c65;color:white;border:1px solid #8da8c0;border-radius:22px;padding:9px 15px;cursor:pointer;font-size:16px}button:hover{background:#315d8d}#count{font-size:14px;color:#bcd}small{position:absolute;right:20px;bottom:12px;background:#071a39bb;padding:5px 10px}@media(max-width:650px){.slide{grid-template-columns:1fr;grid-template-rows:45% 55%}.words{padding:22px 24px}h1{margin:8px 0;font-size:25px}p{font-size:16px;line-height:1.3}.controls{bottom:6px;left:6px}button{padding:6px 10px;font-size:13px}small{display:none}}</style></head><body><main class="slide"><section class="words"><div class="eyebrow">ATELIER CRÉATIF · EMBOSSAGE SUR ALUMINIUM</div><h1 id="title"></h1><p id="body"></p></section><section class="photo"><img id="pic" alt="Étape de création"></section></main><nav class="controls"><button onclick="prev()">◀</button><button onclick="toggle()" id="play">⏸ Pause</button><button onclick="next()">▶</button><button onclick="speak()">🔊 Écouter</button><span id="count"></span></nav><small>Images extraites de la vidéo fournie · Démonstration : @craftycharu</small><script>const steps=[{"title": "Introduction", "body": "Découvrons comment transformer une simple feuille de papier aluminium en une œuvre en relief, avec des matériaux faciles à trouver à la maison.", "img": "images/etape_01.jpg"}, {"title": "Préparer le support", "body": "Prépare une base rigide, une feuille d’aluminium, un dessin sur papier, un crayon à pointe arrondie, de la colle, un pinceau et de la peinture foncée.", "img": "images/etape_02.jpg"}, {"title": "Dessiner un motif", "body": "Choisis un motif simple, par exemple un cœur avec des fleurs. Trace-le sur une feuille de papier.", "img": "images/etape_03.jpg"}, {"title": "Transférer les contours", "body": "Pose le dessin sur la feuille d’aluminium, elle-même placée sur un support souple. Repasse doucement sur les contours avec un outil non pointu.", "img": "images/etape_04.jpg"}, {"title": "Créer les reliefs", "body": "Retire le modèle. Reprends les lignes sur l’aluminium et ajoute des détails en exerçant une pression légère et régulière.", "img": "images/etape_05.jpg"}, {"title": "Faire apparaître les textures", "body": "Travaille délicatement les pétales, les feuilles et les espaces autour du motif pour donner du volume à ta composition.", "img": "images/etape_06.jpg"}, {"title": "Fixer le décor", "body": "Avec l’aide d’un adulte, fixe le travail en aluminium sur un support rigide à l’aide d’une colle adaptée.", "img": "images/etape_07.jpg"}, {"title": "Préparer le cadre", "body": "Tu peux décorer un cadre en carton et le peindre d’une couleur sombre pour faire ressortir le métal argenté.", "img": "images/etape_08.jpg"}, {"title": "Accentuer les contrastes", "body": "Applique une petite quantité de peinture foncée dans les creux, puis essuie doucement la surface pour révéler les reliefs.", "img": "images/etape_09.jpg"}, {"title": "Présenter sa création", "body": "Ton tableau en relief est terminé ! Observe les détails, les lumières et les ombres. Chaque création est unique.", "img": "images/etape_10.jpg"}];let n=0,playing=true,timer=null;const title=document.getElementById('title'),body=document.getElementById('body'),pic=document.getElementById('pic');function speak(){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(steps[n].title+'. '+steps[n].body);u.lang='fr-FR';u.rate=.85;speechSynthesis.speak(u)}function render(){title.textContent=steps[n].title;body.textContent=steps[n].body;pic.src=steps[n].img;document.getElementById('count').textContent=(n+1)+' / '+steps.length;speak();clearTimeout(timer);if(playing)timer=setTimeout(next,15500)}function next(){n=(n+1)%steps.length;render()}function prev(){n=(n-1+steps.length)%steps.length;render()}function toggle(){playing=!playing;document.getElementById('play').textContent=playing?'⏸ Pause':'▶ Lecture';render()}document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();if(e.key===' ')toggle()});render();</script></body></html>
